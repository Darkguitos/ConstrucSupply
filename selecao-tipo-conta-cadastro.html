<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstructSupply - Escolha o Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card-container">

    <!-- Botão de Voltar -->
    <button type="button" class="btn-back" aria-label="Voltar" onclick="history.back()">&larr;</button>

    <!-- Cabeçalho -->
    <header class="card-header">
      <h1 class="title">Escolha o Cadastro</h1>
      <p class="subtitle">Seu Marketplace de Materiais de Construção</p>
    </header>

    <!-- Formulário de Seleção -->
    <form class="options-form" action="" method="GET">

      <!-- Opção 1: Cliente -->
      <label class="account-option">
        <input type="radio" name="account_type" value="cliente" checked>
        
        <div class="option-card">
          <div class="icon-wrapper">
            <!-- Ícone de Usuário -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1-1-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
          </div>

          <div class="option-info">
            <span class="option-title">Cliente</span>
            <span class="option-desc">Compre materiais para seu projeto</span>
            <span class="option-badge">CPF OBRIGATÓRIO</span>
          </div>

          <!-- Seta Indicativa -->
          <div class="arrow-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right" viewBox="0 0 16 16">
              <path d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"/>
            </svg>
          </div>
        </div>
      </label>

      <!-- Opção 2: Empresa -->
      <label class="account-option">
        <input type="radio" name="account_type" value="empresa">
        
        <div class="option-card">
          <div class="icon-wrapper">
            <!-- Ícone de Empresa -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-briefcase" viewBox="0 0 16 16">
              <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5m1.886 6.914L15 7.151V12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V7.15l6.614 1.764a1.5 1.5 0 0 0 .772 0M1.5 4h13a.5.5 0 0 1 .5.5v1.616L8.129 7.948a.5.5 0 0 1-.258 0L1 6.116V4.5a.5.5 0 0 1 .5-.5"/>
            </svg>
          </div>

          <div class="option-info">
            <span class="option-title">Empresa</span>
            <span class="option-desc">Conta de Vendedor</span>
            <span class="option-badge">CNPJ OBRIGATÓRIO</span>
          </div>

          <!-- Seta Indicativa -->
          <div class="arrow-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right" viewBox="0 0 16 16">
              <path d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"/>
            </svg>
          </div>
        </div>
      </label>

      <!-- Botão de Ação -->
      <button type="submit" class="btn-primary">Continuar com a seleção</button>
    </form>

    <!-- Rodapé -->
    <footer class="card-footer">
      <p>Já tem uma conta? <a href="" class="login-link">Entrar</a></p>
    </footer>

  </main>

</body>
</html>
