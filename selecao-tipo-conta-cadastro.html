<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstructSupply - Escolha o Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-tela="selecao-tipo-conta-cadastro">

  <main class="cartao-conteiner">

    <!-- botão da volta -->
    <button type="button" class="botao-voltar" aria-label="Voltar" data-voltar data-destino-alternativo="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left-short" aria-hidden="true" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5"/>
</svg></button>

    <!-- head -->
    <header class="cartao-cabecalho">
      <h1 class="titulo">Escolha o Cadastro</h1>
      <p class="subtitulo">Seu Marketplace de Materiais de Construção</p>
    </header>

    <!-- forms de seleção -->
    <form class="opcoes-formulario" action="" method="GET" data-selecao-cadastro data-destino-cliente="cadastro-cliente.html" data-destino-empresa="cadastro-empresa.html">

      <!-- Opção 1 é do cliente  -->
      <label class="conta-opcao">
        <input type="radio" name="account_type" value="cliente" checked>

        <div class="opcao-cartao">
          <div class="icone-envoltorio">
            <!-- icone do usuário ou pessoa  -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" aria-hidden="true" viewBox="0 0 16 16">
  <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
</svg>
          </div>

          <div class="opcao-informacoes">
            <span class="opcao-titulo">Cliente</span>
            <span class="opcao-descricao">Compre materiais para seu projeto</span>
            <span class="opcao-selo">CPF OBRIGATÓRIO</span>
          </div>

          <div class="seta-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-right" aria-hidden="true" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
</svg>
          </div>
        </div>
      </label>

      <!-- Opção 2 é da empresa -->
      <label class="conta-opcao">
        <input type="radio" name="account_type" value="empresa">

        <div class="opcao-cartao">
          <div class="icone-envoltorio">
            <!-- icone de empresa/edificio -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-building" aria-hidden="true" viewBox="0 0 16 16">
  <path d="M4 2.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3.5-.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zM4 5.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zM7.5 5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm2.5.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zM4.5 8a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm2.5.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3.5-.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z"/>
  <path d="M2 1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1zm11 0H3v14h3v-2.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V15h3z"/>
</svg>
          </div>

          <div class="opcao-informacoes">
            <span class="opcao-titulo">Empresa</span>
            <span class="opcao-descricao">Conta de Vendedor</span>
            <span class="opcao-selo">CNPJ OBRIGATÓRIO</span>
          </div>

          <div class="seta-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-right" aria-hidden="true" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
</svg>
          </div>
        </div>
      </label>

      <!-- botão que confirma a seleção -->
      <button type="submit" class="botao-principal">Continuar com a seleção</button>
    </form>

    <!-- rodapé -->
    <footer class="cartao-rodape">
      <p>Já tem uma conta? <a href="index.html" class="entrar-link" data-ir-para="index.html">Entrar</a></p>
    </footer>

  </main>

  <script src="script.js" defer></script>
</body>
</html>
